# Copy to /etc/npd-loader/config.toml (mode 600). Never commit the real file.

[source]
manifest_url = "https://directory.cms.gov/downloads/manifest.json"

[storage]
backend = "local"
root = "/home/cbadmin/national_provider_dir/npd_data"   # npd_data_folder

[credentials]
backend = "config"

[npd_db]
host = "192.10.0.6"
port = 5432
dbname = "npd"
user = "..."
password = "..."
raw_schema = "npd_raw"
schema = "npd"
lock_timeout_seconds = 30     # publish/retention give up waiting for a table lock after this (3 attempts)

[catalog]
backend = "css_catalog_pg"
host = "192.10.0.6"
port = 5432
dbname = "css_catalog_local"
user = "..."
password = "..."
project = "NPD"
run_type = "National Provider Directory"
file_set = "NPD_FHIR"
# SQL Server alternative: replace backend/host/port/dbname/user/password above with these two lines.
# The login comes from the ODBC string; run_table/file_table default to dbo.MASTER_WAREHOUSE_RUN / dbo.DATA_FILE.
# backend = "mssql"
# odbc = "Driver={ODBC Driver 18 for SQL Server};Server=cssnpi;Database=HIE_WAREHOUSE_META;Trusted_Connection=yes;TrustServerCertificate=yes"

[download]
max_attempts = 8
backoff_seconds = 5
timeout_seconds = 60

[retention]
keep_releases = 5
